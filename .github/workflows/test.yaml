name: Test compilation
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install flake8
        run: pip3 install flake8 flake8-bandit bandit pbr
      - name: Run flake8
        run: python3 -m flake8 .
  compile-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - uses: egor-tensin/setup-gcc@v2
        with:
          version: latest
          platform: x64
        if: ${{ !env.ACT }}
      - name: Bootstrap
        run: ./bootstrap.sh
      - name: Configure
        run: ./configure --without-gtk --without-jansson
      - name: Make
        run: make -j $(nproc)
      - name: Run sample mtr against 1.1.1.1
        run: ./mtr --report --report-cycles 1 -m 1 1.1.1.1
      - name: Run test - file_hosts.py
        run: python3 ./test/file_hosts.py
      - name: Run test - cmdparse.py
        run: sudo python3 ./test/cmdparse.py
